name: go | Quality gate

# Every pull request passes vet, blocking lint, unit tests on Linux, macOS and
# Windows, real Packer/OCI/QEMU acceptance, govulncheck, cross-compilation and
# merged unit/acceptance coverage (>=95% total, >=95% per package). The gate job
# is the single required status check. Native-host execution stays separate.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: 'off'

jobs:
  unit:
    name: 'Unit tests (${{ matrix.os }})'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: Vet
        run: go vet ./...

      - name: Unit tests (race, shuffle, coverage)
        shell: bash
        run: make test

      - name: Upload unit coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cover-unit-${{ matrix.os }}
          path: cover/unit
          include-hidden-files: true
          retention-days: 7

  acceptance:
    name: 'Acceptance (Packer, OCI and two QEMU clones)'
    permissions:
      contents: read
    uses: ./.github/workflows/linux-acceptance.yml

  lint:
    name: 'Lint (blocking)'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: Validate transitional package lock
        run: go run ./cmd/imageweave image check-lock

      # The linter version lives in a plain file so the deps refresh job can
      # move it without the workflows permission a workflow edit would need.
      - name: Linter version
        id: lintver
        run: echo "version=$(tr -d '[:space:]' < .github/golangci-lint-version)" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.lintver.outputs.version }}
          args: --config=.golangci.yml --new=false --fix=false

  vuln:
    name: 'govulncheck'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: govulncheck
        run: make vuln

  build:
    name: 'Cross-compile'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: Build every cmd/* binary for every release platform (CGO disabled)
        run: make build

  coverage:
    name: 'Coverage gate (≥95% total, ≥95% per package)'
    needs: [unit, acceptance]
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: Download every coverage directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cover-*
          path: cover

      - name: Merge and enforce the gate
        run: make cover


  packer:
    name: 'Packer template matrix'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install pinned Packer and validation tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-system-arm qemu-utils xorriso jq
          curl -fsSL https://releases.hashicorp.com/packer/1.16.0/packer_1.16.0_linux_amd64.zip -o "$RUNNER_TEMP/packer.zip"
          echo "5edcd14ab59b535040c512dbecd6ec9ef976a000b073c19d93e4c431c948581e  $RUNNER_TEMP/packer.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/imageweave-tools"
          unzip "$RUNNER_TEMP/packer.zip" packer -d "$RUNNER_TEMP/imageweave-tools"
          echo "$RUNNER_TEMP/imageweave-tools" >> "$GITHUB_PATH"
      - name: Validate every implemented release and architecture
        run: make packer-check

  gate:
    name: 'Quality gate'
    if: always()
    needs: [unit, acceptance, lint, vuln, build, coverage, packer]
    runs-on: ubuntu-latest
    steps:
      - name: Every gate job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a gate job did not succeed"; exit 1; }
          done
